<!--Reserva_y_Contacto-->
<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Destino Cordillera | Reserva y Contacto</title>
	</head>
	<body>
		<header>
		    <h1>Reservas y Contacto</h1>
            <a href="index.html">Inicio</a>
		</header>
		<main>
			<section>
				<h2>Reservas</h2>
                <p>Seleccione su destino y la fecha prevista</p>
                <div>
                    <label for="destino">Destino:<br></label>
                    <input list="destinos" id="destino" placeholder="Seleccione su destino">
                    <datalist id="destinos">
                        <option value="Arica y Parinacota">
                        <option value="Tarapacá">
                        <option value="Antofagasta">
                        <option value="Atacama">
                        <option value="Coquimbo">
                        <option value="Valparaíso">
                        <option value="Metropolitana de Santiago">
                        <option value="Libertador General Bernardo O'Higgins">
                        <option value="Maule">
                        <option value="Ñuble">
                        <option value="Biobío">
                        <option value="La Araucanía">
                        <option value="Los Ríos">
                        <option value="Los Lagos">
                        <option value="Aysén del General Carlos Ibáñez del Campo">
                        <option value="Magallanes y de la Antártica Chilena">
                    </datalist>
                </div>
                <div>
                    <label for="fecha">Fecha:<br></label>
                    <input type="date" id="fecha" placeholder="DD/MM/AAAA">
                </div>
			</section>
			<section>
				<h2>Contacto</h2>
				<p>Ingrese sus datos de contacto y su consulta para que podamos comunicarnos con usted.</p>
  				<div>
                    <label for="nombre">Nombre:<br></label>
                    <input type="text" id="nombre" placeholder="Nombre">
                </div>
  				<div>
                    <label for="apellidos">Apellidos:<br></label>
                    <input type="text" id="apellidos" placeholder="Apellido 1 Apellido 2">
                </div>
  				<div>
                    <label for="telefono">Teléfono:<br></label>
                    <div id="telefono">
	                    <input list="cod_area" placeholder="+">
	                    <datalist id="cod_area">
	                        <option value="+56">
	                        <option value="+1">
	                        <option value="+52">
	                        <option value="+55">
	                        <option value="+54">
	                        <option value="+57">
	                        <option value="+58">
	                        <option value="+51">
	                        <option value="+593">
	                        <option value="+53">
	                        <option value="+591">
	                        <option value="+506">
	                        <option value="+507">
	                        <option value="+598">
	                    </datalist>
	                    <input type="number" placeholder="1234567890">
                    </div>
                </div>
  				<div>
                    <label for="correo">Correo:<br></label>
                    <input type="email" id="correo" placeholder="su_correo@ejemplo.com">
                </div>
                <div>
                    <label for="consulta">Consulta:<br></label>
                    <input type="text" id="consulta" placeholder="Su consulta aquí">
                </div>
			</section>
		</main>
		<footer>
			<h3>Destino Cordillera</h3>
			<p>&copy 2023 Destino Cordillera.</p>
		</footer>
	</body>
</html>
