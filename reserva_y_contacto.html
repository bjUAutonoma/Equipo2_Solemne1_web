<!--Reserva_y_Contacto-->
<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Destino Cordillera | Reserva y Contacto</title>
	</head>
	<body>
		<header>
			<h1>Reservas y Contacto</h1>
            <a href="index.html">Inicio</a>
		</header>
		<main>
			<section>
				<h2>Reservas</h2>
                <p>Seleccione su destino y la fecha prevista</p>
                <div>
                    <input type="date" placeholder="DD/MM/AAAA">
                </div>
			</section>
			<section>
				<h2>Contacto</h2>
				<p>Ingrese sus datos de contacto y su consulta para que podamos comunicarnos con usted.</p>
  				<div>
                    <input type="text" placeholder="Nombre">
                </div>
  				<div>
                    <input type="text" placeholder="Apellido 1 Apellido 2">
                </div>
  				<div>
                    <input type="number" placeholder="1234567890">
                </div>
  				<div>
                    <input type="email" placeholder="su_correo@ejemplo.com">
                </div>
                <div>
                    <input type="text" placeholder="Su consulta aquí">
                </div>
			</section>
		</main>
		<footer>
			<h3>Destino Cordillera</h3>
			<p>&copy 2023 Destino Cordillera.</p>
		</footer>
	</body>
</html>
